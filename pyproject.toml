[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spot-perp-lab"
version = "0.1.0"
description = "Research whether perpetual-futures signed trade flow improves spot-return forecasts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matthew Tichborne" }]
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
spot-perp = "spot_perp_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spot_perp_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
