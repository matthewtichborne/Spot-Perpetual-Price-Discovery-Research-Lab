[build-system]
requires = [
  "pybind11>=2.13,<4",
  "scikit-build-core>=0.10,<1",
]
build-backend = "scikit_build_core.build"

[project]
name = "spot-perp-lab"
version = "1.0.0"
description = "Research whether perpetual-futures signed trade flow improves spot-return forecasts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matthew Tichborne" }]
dependencies = [
  "duckdb>=1.3,<2",
  "matplotlib>=3.10,<4",
  "polars>=1.32,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "statsmodels>=0.14,<1",
  "typer>=0.12,<1",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
spot-perp = "spot_perp_lab.cli:app"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/spot_perp_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
